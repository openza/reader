    <text x="450" y="550" font-size="18" fill="#111827">Render Markdown safely with raw HTML escaped by default.</text>

    <rect x="405" y="600" width="650" height="1" fill="#d1d5db"/>
    <text x="405" y="656" font-size="30" fill="#0f172a" font-weight="800">2. Native Windows Experience</text>
