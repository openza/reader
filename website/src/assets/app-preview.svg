  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="405" y="190" font-size="42" fill="#0f172a" font-weight="800">Markdown Reader for Windows</text>
    <text x="405" y="242" font-size="20" fill="#475569">Fast, safe Markdown reading in a modern WinUI 3 app.</text>
    <rect x="405" y="280" width="650" height="1" fill="#d1d5db"/>

    <text x="405" y="350" font-size="30" fill="#0f172a" font-weight="800">1. Vision</text>
    <rect x="405" y="374" width="650" height="1" fill="#e5e7eb"/>
    <text x="405" y="422" font-size="18" fill="#111827">Build a focused Markdown reader for Windows that opens files instantly.</text>

    <circle cx="430" cy="468" r="4" fill="#111827"/>
    <text x="450" y="474" font-size="18" fill="#111827">Open .md files from Explorer, drag and drop, or the file picker.</text>
