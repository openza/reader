version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Keep Dependabot security updates enabled in repository settings, but
    # pause routine version-update PRs while V1 is still taking shape.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Keep Dependabot security updates enabled in repository settings, but
    # pause routine version-update PRs while V1 is still taking shape.
    open-pull-requests-limit: 0
