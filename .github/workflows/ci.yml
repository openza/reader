name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows build, test, and package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore src/Openza.Reader.Tests/Openza.Reader.Tests.csproj

      - name: Restore app
        run: dotnet restore src/Openza.Reader/Openza.Reader.csproj

      - name: Restore Avalonia app
        run: dotnet restore src/Openza.Reader.Avalonia/Openza.Reader.Avalonia.csproj -r win-x64

      - name: Test
        run: dotnet test src/Openza.Reader.Tests/Openza.Reader.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Build app
        run: dotnet build src/Openza.Reader/Openza.Reader.csproj -c Release --no-restore --verbosity normal

      - name: Build Avalonia app
        run: dotnet build src/Openza.Reader.Avalonia/Openza.Reader.Avalonia.csproj -c Release --no-restore --verbosity normal

      - name: Validate Avalonia Windows package
        shell: pwsh
        run: .\eng\package-windows.ps1 -Architecture x64 -Version 1.2.0.0

  linux:
    name: Ubuntu Avalonia build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore src/Openza.Reader.Tests/Openza.Reader.Tests.csproj

      - name: Restore Avalonia app
        run: dotnet restore src/Openza.Reader.Avalonia/Openza.Reader.Avalonia.csproj

      - name: Test
        run: dotnet test src/Openza.Reader.Tests/Openza.Reader.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Build Avalonia app
        run: dotnet build src/Openza.Reader.Avalonia/Openza.Reader.Avalonia.csproj -c Release --no-restore --verbosity normal
