name: Feature request
description: Suggest a V1-aligned improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reading workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: V1 scope check
      options:
        - label: This keeps Openza Reader read-only.
          required: true
        - label: This does not add sync, accounts, plugins, AI features, tabs, export, Mermaid, or math rendering.
          required: true
